name: ItemsDrop
version: '1.0.0'
main: com.itemsdrop.plugin.ItemsDropPlugin
api-version: '1.21'
author: ItemsDrop
description: Donne un item aleatoire a tous les joueurs a intervalle regulier

commands:
  itemsdrop:
    description: Demarre ou arrete la distribution automatique d'items aleatoires
    usage: /itemsdrop <start|stop|reload>
    permission: itemsdrop.use
    permission-message: "Tu n'as pas la permission d'utiliser cette commande."

permissions:
  itemsdrop.use:
    description: Permet d'utiliser la commande /itemsdrop
    default: op
