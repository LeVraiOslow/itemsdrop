# Intervalle en secondes entre chaque distribution d'items
interval-seconds: 10

# Message envoye dans le chat a chaque distribution (laisser vide "" pour desactiver)
# %player% sera remplace par le nom du joueur, %item% par le nom de l'item
broadcast-message: "%player% a recu un item aleatoire : %item% !"

# Nombre d'items donnes a chaque joueur a chaque distribution
amount-per-drop: 1

# Liste des items pouvant etre distribues (noms de Material Bukkit/Paper, en majuscules)
# Si cette liste est vide, un item totalement aleatoire sera choisi parmi tous les items du jeu
items:
  - DIAMOND
  - GOLD_INGOT
  - IRON_INGOT
  - EMERALD
  - APPLE
  - GOLDEN_APPLE
  - BOW
  - ARROW
  - COOKED_BEEF
  - ENDER_PEARL
  - EXPERIENCE_BOTTLE
  - TNT
  - DIAMOND_SWORD
  - SHIELD
  - FIREWORK_ROCKET
